# Host nginx for Autodispatcher: TLS termination + reverse proxy to the compose `web`
# container (127.0.0.1:8080).
#
# Certificates are NOT managed here: they are pulled in from your own snippet
# (`/etc/nginx/snippets/DOMAIN.conf`), which must contain ssl_certificate / ssl_certificate_key.
#
# Install:
#   sudo cp deploy/nginx/autodispatcher.conf /etc/nginx/sites-available/autodispatcher.conf
#   sudo sed -i 's/DOMAIN/your.domain.ru/g' /etc/nginx/sites-available/autodispatcher.conf
#   # create /etc/nginx/snippets/your.domain.ru.conf with the certificate lines (see README)
#   sudo ln -sf /etc/nginx/sites-available/autodispatcher.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream autodispatcher_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Optional: redirect plain HTTP to HTTPS. Drop this block if TLS is terminated upstream.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    # --- TLS: certificates from your snippets ------------------------------------------------
    include snippets/DOMAIN.conf;          # ssl_certificate / ssl_certificate_key
    # include snippets/ssl-params.conf;    # uncomment if you keep shared TLS params in a snippet

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    client_max_body_size 16m;

    # WebSocket: live field.state / kpi.index feed to the dispatcher UI.
    location /ws {
        proxy_pass http://autodispatcher_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else: UI, /api, /docs, /openapi.json.
    location / {
        proxy_pass http://autodispatcher_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
