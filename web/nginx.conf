# nginx in the web container: the UI at "/", REST at /api, WebSocket at /ws, Swagger at /docs (CLAUDE.md §23).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;  # what-if and manual commit answer within seconds
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;  # field.state twice a second: no buffering on the way to the screen
    }

    location ~ ^/(docs|openapi.json|health) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # hashed assets: cache; index.html: never (a new build must be picked up at once)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
