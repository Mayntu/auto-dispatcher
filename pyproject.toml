[project]
name = "autodispatcher"
version = "0.1.0"
description = "Автодиспетчер — консультативная система поддержки решений поездного диспетчера (MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "ortools>=9.10",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
