[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodispatcher"
version = "0.1.0"
description = "Автодиспетчер — консультативная система поддержки решений поездного диспетчера"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "ortools>=9.10",
    "numpy",
    "aio-pika>=9.4",
    "asyncpg>=0.29",
    "structlog>=24.1",
    "PyJWT>=2.8",
    "prometheus-client>=0.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]
reports = ["weasyprint"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
